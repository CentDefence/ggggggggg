<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b20"><title>Профиль игрока · TRS CIS League</title><style>
:root{color-scheme:dark;--line:#ffffff19;--muted:#aaa5bc;--violet:#a47bff;--green:#42dda4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#39245b,transparent 40%),radial-gradient(ellipse at 90% 80%,#361c42,transparent 38%),#100b20;color:#f6f2ff;font:15px Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1050px)/2))}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--violet)}.button{border:1px solid var(--line);border-radius:10px;background:#ffffff0b;padding:10px 14px;font-weight:800;font-size:12px}.wrap{width:min(1000px,calc(100% - 32px));margin:48px auto}.hero{padding:30px;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;border:1px solid var(--line);border-radius:22px;background:linear-gradient(110deg,#29203e,#191624 55%,#241829);position:relative;overflow:hidden}.hero:before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--violet)}.avatar{width:112px;height:112px;object-fit:cover;border-radius:24px;border:2px solid #a47bff;background:#2c263b}.eyebrow{color:#b99bff;font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(27px,5vw,42px);margin:8px 0 3px}.handle{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{border:1px solid #8b70ce7a;background:#664d9929;padding:7px 11px;border-radius:99px;font-size:11px;font-weight:800}.chip.green{color:var(--green);border-color:#42dda459;background:#42dda414}.stats{display:flex;gap:9px}.stat{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:#100e18;min-width:95px}.stat b{font-size:19px;display:block}.stat small{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(140deg,#1c1929,#15131e);padding:21px}.card h2{margin:0 0 5px;font-size:16px}.card p{margin:0 0 18px;color:var(--muted);font-size:12px}.account{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:13px 0}.account img{width:52px;height:52px;object-fit:cover;border-radius:16px;background:#302a3b}.account.roblox img{border-radius:50%}.account b{font-size:13px}.account small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.tag{margin-left:auto;color:var(--green);font-size:10px;font-weight:900}.details{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail{padding:12px;border:1px solid var(--line);border-radius:11px;background:#ffffff05}.detail small{display:block;color:var(--muted);font-size:9px;margin-bottom:7px}.detail b{font-size:12px}.load,.error{width:min(540px,calc(100% - 32px));margin:18vh auto;padding:30px;border:1px solid var(--line);border-radius:18px;background:#191526;text-align:center;color:#dad4e5}.error p{color:var(--muted)}.error a{color:#b99bff}@media(max-width:650px){.wrap{margin:25px auto}.hero{grid-template-columns:auto 1fr;padding:22px 17px;gap:14px}.avatar{width:75px;height:75px;border-radius:19px}.stats{grid-column:1/-1}.stat{flex:1}.grid{grid-template-columns:1fr}.nav{padding:0 16px}}
</style></head><body><header class="nav"><a class="brand" href="/">TRS <span>CIS</span> LEAGUE</a><a class="button" href="/">Все игроки</a></header><main id="app"><div class="load">Загружаем профиль игрока…</div></main><script>
const app=document.getElementById('app');function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{try{const u=new URLSearchParams(location.search).get('u');let p;if(u){const r=await fetch('/api/profiles?username='+encodeURIComponent(u),{cache:'no-store'});if(!r.ok)throw Error('not_found');p=(await r.json()).profile}else{const r=await fetch('/api/verification/status',{cache:'no-store',credentials:'same-origin'});const s=await r.json();if(!s.verified||!s.profile){location.replace('/?verify=roblox');return}p=s.profile}
const d=p.discord,r=p.roblox,date=new Date(p.verifiedAt);document.title=(r.displayName||r.username)+' · TRS CIS League';app.innerHTML='<div class="wrap"><section class="hero"><img class="avatar" src="'+esc(r.avatar||d.avatar)+'" alt=""><div><div class="eyebrow">Подтверждённый игрок TCL</div><h1>'+esc(r.displayName||r.username)+'</h1><div class="handle">@'+esc(r.username)+'</div><div class="chips"><span class="chip">Discord · '+esc(d.username)+'</span><span class="chip green">✓ Верифицирован</span></div></div><div class="stats"><div class="stat"><b>✓</b><small>СТАТУС</small></div><div class="stat"><b>2/2</b><small>АККАУНТА</small></div></div></section><div class="grid"><section class="card"><h2>Связанные аккаунты</h2><p>Профили, подтверждённые владельцем.</p><div class="account"><img src="'+esc(d.avatar)+'" alt=""><div><b>'+esc(d.username)+'</b><small>Discord</small></div><span class="tag">CONNECTED</span></div><div class="account roblox"><img src="'+esc(r.avatar)+'" alt=""><div><b>'+esc(r.displayName||r.username)+'</b><small><a href="'+esc(r.profile)+'" target="_blank" rel="noopener">@'+esc(r.username)+' ↗</a></small></div><span class="tag">CONNECTED</span></div></section><section class="card"><h2>Данные профиля</h2><p>Участник сообщества TRS CIS League.</p><div class="details"><div class="detail"><small>ВЕРИФИКАЦИЯ</small><b style="color:#42dda4">Успешно пройдена</b></div><div class="detail"><small>ДАТА</small><b>'+esc(date.toLocaleDateString('ru-RU'))+'</b></div><div class="detail"><small>ROBLOX ID</small><b>'+esc(r.id)+'</b></div><div class="detail"><small>DISCORD ID</small><b>'+esc(d.id)+'</b></div></div></section></div></div>'
}catch(e){app.innerHTML='<section class="error"><h2>Профиль не найден</h2><p>Проверь Roblox username или вернись в каталог игроков.</p><a href="/">Вернуться на сайт →</a></section>'}})();
</script></body></html>
